# Board descriptor. Adding a board = drop one of these + a .cst pin map, and it
# becomes available to `python -m ascon_boards` and `make flash`.
[board]
name        = "tangnano9k"
device      = "GW1NR-LV9QN88PC6/I5"   # yosys/nextpnr/gowin_pack device
family      = "GW1N-9C"               # Apicula device family
freq_mhz    = 27                      # onboard oscillator
loader      = "tangnano9k"            # openFPGALoader -b <this>
constraints = "tangnano9k/tangnano9k.cst"   # pin map, relative to boards/

[tools]
# nextpnr-gowin (classic) or nextpnr-himbaechel (newer). The invocation differs;
# the build driver knows both. Tang Nano 9K works well with either.
nextpnr = "nextpnr-gowin"
